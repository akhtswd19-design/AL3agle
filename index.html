<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر العاقل</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --accent-glow: #3b82f6;
            --gold: #f59e0b;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* شاشة الترحيب (4 ثواني) */
        #splash-screen {
            position: fixed; inset: 0; background: var(--bg-color);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; animation: fadeOut 0.8s ease 3.2s forwards;
        }
        #splash-screen h1 {
            font-size: 2.2rem; color: var(--gold); text-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
            animation: pulseGlow 1.5s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1); text-shadow: 0 0 10px rgba(245,158,11,0.4); }
            100% { transform: scale(1.05); text-shadow: 0 0 25px rgba(245,158,11,0.9); }
        }
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        /* المحتوى الرئيسي */
        .container { flex: 1; padding: 20px; padding-bottom: 90px; max-width: 600px; margin: 0 auto; width: 100%; }
        .header-title { text-align: center; margin-bottom: 25px; font-size: 1.5rem; color: var(--gold); text-shadow: 0 0 10px rgba(245,158,11,0.3); }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: smoothFade 0.4s ease; }
        @keyframes smoothFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* بطاقات المنتجات بإضاءات فاخرة */
        .product-card {
            background: var(--card-bg); border-radius: 16px; overflow: hidden; margin-bottom: 20px;
            border: 1px solid rgba(59, 130, 246, 0.3); box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 0 30px rgba(59, 130, 246, 0.3); }
        .product-img { width: 100%; height: 200px; object-fit: cover; }
        .product-info { padding: 18px; }
        .product-title { font-size: 1.2rem; margin-bottom: 8px; color: #fff; }
        .product-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px; line-height: 1.5; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; }
        .price-tag { font-size: 0.95rem; color: var(--gold); font-weight: bold; }

        .buy-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; border: none;
            padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); transition: transform 0.2s;
        }
        .buy-btn:active { transform: scale(0.95); }

        /* التقييمات */
        .review-card {
            background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 12px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
        .review-name { font-weight: bold; color: var(--gold); margin-bottom: 5px; }
        .review-text { font-size: 0.9rem; color: var(--text-muted); }

        /* شريط التنقل السفلي الفاخر */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background: rgba(19, 28, 46, 0.95);
            backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000;
        }
        .nav-item {
            background: none; border: none; color: var(--text-muted); font-size: 0.9rem;
            display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: color 0.3s;
        }
        .nav-item.active { color: var(--gold); text-shadow: 0 0 10px rgba(245,158,11,0.5); }
        .nav-item span { font-size: 1.3rem; margin-bottom: 3px; }
    </style>
</head>
<body>

    <!-- شاشة الترحيب لمدة 4 ثواني -->
    <div id="splash-screen">
        <h1>متجر العاقل</h1>
    </div>

    <div class="container">
        <!-- صفحة المنتجات -->
        <div id="products-tab" class="tab-content active">
            <h2 class="header-title">🎖️ الملفات العسكرية</h2>
            <div id="products-list">جاري تحميل المنتجات...</div>
        </div>

        <!-- صفحة التقييمات -->
        <div id="reviews-tab" class="tab-content">
            <h2 class="header-title">⭐ تقييمات العملاء</h2>
            <div id="reviews-list">جاري تحميل التقييمات...</div>
        </div>
    </div>

    <!-- شريط التنقل -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchTab('products', this)">
            <span>📁</span> المنتجات
        </button>
        <button class="nav-item" onclick="switchTab('reviews', this)">
            <span>⭐</span> التقييمات
        </button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if(tabName === 'products') {
                document.getElementById('products-tab').classList.add('active');
            } else if(tabName === 'reviews') {
                document.getElementById('reviews-tab').classList.add('active');
            }
            btn.classList.add('active');
        }

        // جلب البيانات وعرضها
        fetch('/api/store-data')
            .then(res => res.json())
            .then(data => {
                // عرض المنتجات
                const prodContainer = document.getElementById('products-list');
                prodContainer.innerHTML = '';
                data.products.forEach(p => {
                    prodContainer.innerHTML += `
                        <div class="product-card">
                            <img src="${p.image_url}" class="product-img" alt="${p.title}">
                            <div class="product-info">
                                <h3 class="product-title">${p.title}</h3>
                                <p class="product-desc">${p.description}</p>
                                <div class="product-footer">
                                    <span class="price-tag">السعر: ${p.price_sar} ر.س (⭐ ${p.stars} نجمة)</span>
                                    <button class="buy-btn" onclick="buyProduct(${p.id})">شراء الآن</button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                // عرض التقييمات
                const revContainer = document.getElementById('reviews-list');
                revContainer.innerHTML = '';
                data.reviews.forEach(r => {
                    revContainer.innerHTML += `
                        <div class="review-card">
                            <div class="review-name">${r.name}</div>
                            <div class="review-text">${r.text}</div>
                        </div>
                    `;
                });
            });

        // دفع النجوم الفوري داخل المتجر المصغر دون مغادرته
        function buyProduct(productId) {
            fetch('/create-invoice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product_id: productId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.invoice_link) {
                    tg.openInvoice(data.invoice_link, function(status) {
                        if (status === 'paid') {
                            alert('تم الدفع بنجاح! سيتم إرسال رابط الملفات لك.');
                        }
                    });
                } else {
                    alert('تعذر إنشاء الفاتورة.');
                }
            });
        }
    </script>
</body>
</html>
