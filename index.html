<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر العاقل</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --gold-color: #fbbf24;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* شاشة الترحيب لمدة 4 ثوانٍ */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1e293b 0%, #0b0f19 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOut 0.6s ease 3.4s forwards;
        }
        #splash-screen h1 {
            color: var(--gold-color);
            font-size: 2.8rem;
            text-shadow: 0 0 25px rgba(251, 191, 36, 0.6);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.06); opacity: 1; text-shadow: 0 0 35px rgba(251, 191, 36, 0.9); }
            100% { transform: scale(1); opacity: 0.8; }
        }
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            box-sizing: border-box;
            padding-bottom: 90px;
        }
        h2.title {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        .product-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 18px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.25);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover {
            transform: translateY(-4px);
        }
        .product-card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .product-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .product-desc {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 14px;
            line-height: 1.4;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            background: rgba(15, 23, 42, 0.5);
            padding: 10px 14px;
            border-radius: 10px;
        }
        .price-sar {
            color: #cbd5e1;
            font-size: 0.95rem;
        }
        .price-stars {
            color: var(--gold-color);
            font-weight: bold;
            font-size: 1.15rem;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }
        .buy-btn {
            width: 100%;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0b0f19;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4);
            transition: all 0.25s ease;
        }
        .buy-btn:active {
            transform: scale(0.97);
        }

        /* شريط التنقل السفلي الفاخر */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(19, 27, 46, 0.85);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
        }
        .nav-item {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.3s ease;
        }
        .nav-item.active {
            color: var(--accent-color);
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
            transform: translateY(-2px);
        }
        .section { display: none; opacity: 0; transition: opacity 0.4s ease; }
        .section.active { display: block; opacity: 1; }
        
        .review-card {
            background: var(--card-bg);
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <!-- شاشة الترحيب -->
    <div id="splash-screen">
        <h1>متجر العاقل</h1>
    </div>

    <div class="container">
        <!-- قسم المنتجات -->
        <div id="products-section" class="section active">
            <h2 class="title">🎖️ الملفات العسكرية</h2>
            <div id="products-list">جاري تحميل المنتجات...</div>
        </div>

        <!-- قسم التقييمات -->
        <div id="reviews-section" class="section">
            <h2 class="title">⭐ تقييمات العملاء</h2>
            <div id="reviews-list">جاري تحميل التقييمات...</div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('products', this)">
            <span style="font-size: 1.2rem;">📁</span>
            <span>المنتجات</span>
        </button>
        <button class="nav-item" onclick="switchTab('reviews', this)">
            <span style="font-size: 1.2rem;">⭐</span>
            <span>التقييمات</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function switchTab(tab, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            setTimeout(() => {
                if(tab === 'products') {
                    document.getElementById('products-section').classList.add('active');
                } else {
                    document.getElementById('reviews-section').classList.add('active');
                }
            }, 50);
            btn.classList.add('active');
        }

        // جلب البيانات من السيرفر
        fetch('/api/store-data')
            .then(res => res.json())
            .then(data => {
                const pList = document.getElementById('products-list');
                if(data.products.length === 0) {
                    pList.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:40px;">لا توجد منتجات حالياً.</p>';
                } else {
                    pList.innerHTML = data.products.map(p => `
                        <div class="product-card">
                            <img src="${p.image_url || 'https://via.placeholder.com/400x200'}" alt="${p.title}">
                            <div class="product-title">${p.title}</div>
                            <div class="product-desc">${p.description}</div>
                            <div class="price-row">
                                <span class="price-sar">السعر: ${p.price_sar} ر.س</span>
                                <span class="price-stars">★ ${p.stars} نجمة</span>
                            </div>
                            <button class="buy-btn" onclick="buyProduct(${p.id})">شراء الآن (★ ${p.stars} نجمة)</button>
                        </div>
                    `).join('');
                }

                const rList = document.getElementById('reviews-list');
                if(data.reviews.length === 0) {
                    rList.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:40px;">لا توجد تقييمات حالياً.</p>';
                } else {
                    rList.innerHTML = data.reviews.map(r => `
                        <div class="review-card">
                            <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                                <strong>${r.user_name}</strong>
                                <span style="color:var(--gold-color);">${'⭐'.repeat(r.rating)}</span>
                            </div>
                            <p style="margin: 0; color:#cbd5e1; font-size: 0.9rem; line-height:1.4;">${r.comment}</p>
                        </div>
                    `).join('');
                }
            });

        function buyProduct(productId) {
            tg.sendData("buy_" + productId);
            tg.close();
        }
    </script>
</body>
</html>
