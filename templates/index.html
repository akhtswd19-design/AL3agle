<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>متجر العاقل</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(22, 28, 38, 0.7);
            --accent-gold: #ffd700;
            --accent-glow: rgba(255, 215, 0, 0.25);
            --text-color: #ffffff;
            --text-muted: #8e9aaf;
            --btn-blue: #3182ce;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* خلفية الإضاءة والتوهج */
        .glow-bg {
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* شاشة الترحيب (4 ثوان) */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .splash-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--accent-gold);
            text-shadow: 0 0 20px var(--accent-glow);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        /* المحتوى الرئيسي */
        .app-container {
            flex: 1;
            padding: 20px 16px 90px 16px;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .page {
            display: none;
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-title {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* كروت المنتجات */
        .product-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .product-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .price-tag {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .star-price {
            color: var(--accent-gold);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .buy-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #000;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            transition: opacity 0.2s;
        }

        /* كروت التقييمات */
        .review-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .review-user {
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 4px;
            font-size: 0.95rem;
        }

        /* شريط التنقل السفي (Bottom Navigation) */
        .nav-bar {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(20, 25, 35, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .nav-item.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
        }

        .nav-icon {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <!-- شاشة الترحيب مدتها 4 ثوان -->
    <div id="splash-screen">
        <div class="splash-title">متجر العاقل</div>
    </div>

    <!-- المحتوى -->
    <div class="app-container" id="main-content">
        <!-- صفحة المنتجات -->
        <div id="products-page" class="page active">
            <h2 class="header-title">الملفات العسكرية</h2>
            <div id="products-list"></div>
        </div>

        <!-- صفحة التقييمات -->
        <div id="reviews-page" class="page">
            <h2 class="header-title">تقييمات العملاء</h2>
            <div id="reviews-list"></div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('products', this)">
            <span class="nav-icon">📁</span>
            <span>المنتجات</span>
        </div>
        <div class="nav-item" onclick="switchTab('reviews', this)">
            <span class="nav-icon">⭐</span>
            <span>التقييمات</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // إخفاء الشاشة الترحيبية بعد 4 ثوانٍ
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            const mainContent = document.getElementById('main-content');
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                mainContent.style.opacity = '1';
            }, 800);
        }, 4000);

        // التنقل السلس بين الصفحات
        function switchTab(pageName, element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));

            element.classList.add('active');
            document.getElementById(pageName + '-page').classList.add('active');
        }

        // جلب المنتجات والتقييمات من السيرفر
        async function loadData() {
            try {
                const res = await fetch('/api/store-data');
                const data = await res.json();
                
                // عرض المنتجات
                const productsContainer = document.getElementById('products-list');
                productsContainer.innerHTML = '';
                data.products.forEach(p => {
                    productsContainer.innerHTML += `
                        <div class="product-card">
                            <img src="${p.image_url}" class="product-img" alt="${p.title}">
                            <div class="product-title">${p.title}</div>
                            <div class="product-desc">${p.description}</div>
                            <div class="price-tag">
                                <span>السعر: ${p.price_sar} ر.س</span>
                                <span class="star-price">★ ${p.stars} نجمة</span>
                            </div>
                            <button class="buy-btn" onclick="buyProduct(${p.id})">شراء الآن (★ ${p.stars})</button>
                        </div>
                    `;
                });

                // عرض التقييمات
                const reviewsContainer = document.getElementById('reviews-list');
                reviewsContainer.innerHTML = '';
                data.reviews.forEach(r => {
                    reviewsContainer.innerHTML += `
                        <div class="review-card">
                            <div class="review-user">${r.user_name}</div>
                            <div>${'⭐'.repeat(r.rating)}</div>
                            <p style="margin-top:6px; font-size:0.9rem; color:#ccc;">${r.comment}</p>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Error loading store data", e);
            }
        }

        function buyProduct(productId) {
            tg.sendData(JSON.stringify({ action: 'buy', product_id: productId }));
        }

        loadData();
    </script>
</body>
</html>
